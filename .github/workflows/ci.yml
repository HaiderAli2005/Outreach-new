name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aperture
          POSTGRES_PASSWORD: aperture
          POSTGRES_DB: aperture_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U aperture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aperture:aperture@localhost:55432/aperture_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/server
      - run: npm run typecheck
      # Includes test/perf.test.ts: the build fails if the inbox takes 1.5s or more on 50,000 seeded sends.
      - run: npm test -w apps/server
      - run: npm test -w apps/client
      - run: npm run build -w apps/client
